<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#ff9a9e,#fad0c4);
  font-family: 'Segoe UI', sans-serif;
  overflow:hidden;
}
.envelope{
  width:220px;
  height:140px;
  background:#f7d046;
  position:relative;
  cursor:pointer;
}
.letter{
  position:absolute;
  width:200px;
  height:120px;
  background:white;
  top:10px;
  left:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  font-size:14px;
  transform:translateY(80px);
  transition:0.6s;
}
.envelope:hover .letter{
  transform:translateY(-100px);
}
.hearts{
  position:absolute;
  font-size:20px;
  animation:float 3s infinite;
}
@keyframes float{
  0%{transform:translateY(0);opacity:1}
  100%{transform:translateY(-200px);opacity:0}
}
</style>
</head>
<body>

<div class="envelope">
  <div class="letter">
    You are one in a million 💖<br>
    Happy Birthday Blade 🎂<br>
    I love you ❤️
  </div>
</div>

</body>
</html>
